<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book {{ villa.name }}</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #006400; text-align: center; margin-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; box-sizing: border-box; }
        input:focus { outline: none; border-color: #006400; }
        .btn-submit { width: 100%; padding: 15px; background: #006400; color: white; border: none; border-radius: 5px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background: #004d00; }
        .flash { background: #d4edda; color: #155724; padding: 15px; text-align: center; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗓️ Booking Request</h1>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">Submitting this form sends a request; it does not confirm a reservation.</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}{% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endif %}
        {% endwith %}

        <!-- form action="/booking" आणि method="POST" अचूक असणे गरजेचे -->
        <form method="POST" action="/booking">
            <div class="form-group">
                <label>Full name</label>
                <input type="text" name="name" required>
            </div>

            <div class="form-group">
                <label>Mobile number</label>
                <input type="tel" name="phone" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email">
            </div>

            <div class="form-group">
                <label>Check-in</label>
                <input type="date" name="check_in" required>
            </div>

            <div class="form-group">
                <label>Check-out</label>
                <input type="date" name="check_out" required>
            </div>

            <div class="form-group">
                <label>Guests</label>
                <input type="number" name="guests" min="1" max="8" value="2" required>
            </div>

            <button type="submit" class="btn-submit">Submit Request</button>
        </form>
    </div>
</body>
</html>
