{% extends "base.html" %}{% block title %}Booking Request{% endblock %}{% block content %}<section class="section form-wrap"><h1>Booking Request</h1><p>Submitting this form sends a request; it does not confirm a reservation.</p><form method="post">
<label>Full name<input name="full_name" required maxlength="120"></label><label>Mobile number<input name="phone" required maxlength="30"></label><label>Email<input name="email" type="email" maxlength="120"></label>
<label>Check-in<input name="check_in" type="date" required></label><label>Check-out<input name="check_out" type="date" required></label><label>Guests<input name="guests" type="number" min="1" max="30" value="1" required></label><label>Notes<textarea name="notes"></textarea></label><button class="btn">Submit Request</button></form></section>{% endblock %}
