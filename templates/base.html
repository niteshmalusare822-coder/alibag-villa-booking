<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Alibag Villa{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><header class="header"><a class="brand" href="/">Alibag Villa</a><nav><a href="/">Home</a><a href="/gallery/">Gallery</a><a href="/booking/">Book Now</a><a href="/admin/login">Admin</a></nav></header>
<main>{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="messages">{% for category,message in messages %}<p class="{{category}}">{{message}}</p>{% endfor %}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}</main><footer>Alibag Villa Booking Portal</footer></body></html>
